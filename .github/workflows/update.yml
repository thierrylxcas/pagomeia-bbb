name: Atualizar notícias BBB

on:
  schedule:
    - cron: "*/15 * * * *" # a cada 15 minutos
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Baixar RSS Google News
        run: |
          curl -s "https://news.google.com/rss/search?q=BBB+26+OR+%22Big+Brother+Brasil+26%22&hl=pt-BR&gl=BR&ceid=BR:pt-419" > rss.xml

            - name: Converter RSS para JSON
        run: |
          node <<'EOF'
          const fs = require("fs");

          const xml = fs.readFileSync("rss.xml", "utf8");

          // captura QUALQUER <title>...</title>
          const rawTitles = [...xml.matchAll(/<title>(.*?)<\/title>/g)]
            .map(m => m[1].replace(/<!\[CDATA\[|\]\]>/g, "").trim());

          // remove título geral do feed
          const titles = rawTitles
            .filter(t => !t.includes("Google News"))
            .filter(t => t.length > 20)
            .slice(0, 10);

          fs.mkdirSync("data", { recursive: true });

          fs.writeFileSync(
            "data/news.json",
            JSON.stringify(
              {
                source: "Google News",
                updated: new Date().toISOString(),
                news: titles
              },
              null,
              2
            )
          );
          EOF

      - name: Commit alterações
        run: |
          git config user.name "pagomeia-bot"
          git config user.email "bot@pagomeia"
          git add data/news.json
          git commit -m "Atualiza notícias BBB automaticamente" || exit 0
          git push
