name: Atualizar notícias BBB

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # a cada 30 minutos

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar RSS do Google News (BBB)
        run: |
          curl -L "https://news.google.com/rss/search?q=BBB+26+OR+%22Big+Brother+Brasil+26%22&hl=pt-BR&gl=BR&ceid=BR:pt-419" -o rss.xml

      - name: Converter RSS para JSON
        run: |
          node <<'EOF'
          const fs = require("fs");

          const xml = fs.readFileSync("rss.xml", "utf8");

          // Captura TODOS os <title>, com ou sem CDATA
          const rawTitles = [...xml.matchAll(/<title>(.*?)<\/title>/g)]
            .map(m =>
              m[1]
                .replace(/<!\[CDATA\[|\]\]>/g, "")
                .replace(/&amp;/g, "&")
                .replace(/&quot;/g, '"')
                .replace(/&apos;/g, "'")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .trim()
            );

          // Remove título geral do feed e títulos curtos
          const titles = rawTitles
            .filter(t => !t.toLowerCase().includes("google news"))
            .filter(t => t.length > 25)
            .slice(0, 12);

          fs.mkdirSync("data", { recursive: true });

          fs.writeFileSync(
            "data/news.json",
            JSON.stringify(
              {
                source: "Google News",
                updated: new Date().toISOString(),
                news: titles
              },
              null,
              2
            )
          );
          EOF

      - name: Commit e push se houver alterações
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/news.json
          git commit -m "Atualiza notícias do BBB automaticamente" || exit 0
          git push
