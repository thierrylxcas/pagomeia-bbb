name: Atualizar notícias BBB

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar RSS do Google News (BBB)
        run: |
          curl -L "https://news.google.com/rss/search?q=BBB+26+OR+%22Big+Brother+Brasil+26%22&hl=pt-BR&gl=BR&ceid=BR:pt-419" -o rss.xml

      - name: Converter RSS para JSON
        run: |
          node <<'EOF'
          const fs = require("fs");

          const xml = fs.readFileSync("rss.xml", "utf8");

          const rawTitles = [...xml.matchAll(/<title>(.*?)<\/title>/g)]
            .map(m =>
              m[1]
                .replace(/<!\[CDATA\[|\]\]>/g, "")
                .replace(/\s+-\s+.*$/, "") // remove fonte no final
                .trim()
            );

          const news = rawTitles.filter(title => {
            const lower = title.toLowerCase();

            if (lower.includes("google notícias")) return false;
            if (lower.includes("google news")) return false;
            if (lower.includes(" or ")) return false;
            if (lower.includes("bbb 26 or")) return false;
            if (title.length < 35) return false;

            return true;
          }).slice(0, 15);

          fs.mkdirSync("data", { recursive: true });

          fs.writeFileSync(
            "data/news.json",
            JSON.stringify(
              {
                source: "Google News",
                updated: new Date().toISOString(),
                news
              },
              null,
              2
            )
          );
          EOF

      - name: Commit e push se houver alterações
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/news.json
          git commit -m "Atualiza notícias reais do BBB" || exit 0
          git push
