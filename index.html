<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>PagoMeia News BBB</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .ticker {
      position: relative;
      width: 100%;
      height: 70px;
      background: linear-gradient(90deg, #000000, #111111);
      border-top: 2px solid #ffcc00;
      border-bottom: 2px solid #ffcc00;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .label {
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      padding: 10px 18px;
      margin-right: 20px;
      white-space: nowrap;
      font-size: 20px;
    }

    .track {
      display: flex;
      width: max-content;
      animation: scroll 60s linear infinite;
    }

    .news {
      display: flex;
      white-space: nowrap;
      font-size: 22px;
      color: #fff;
    }

    .item {
      margin-right: 60px;
    }

    @keyframes scroll {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>
  <div class="ticker">
    <div class="label">PAGOMEIA • BBB 26</div>
    <div class="track">
      <div class="news" id="news"></div>
      <div class="news" id="news-clone"></div>
    </div>
  </div>

  <script>
    async function loadNews() {
      try {
        const res = await fetch("data/news.json?_=" + Date.now());
        const data = await res.json();

        if (!data.news || data.news.length === 0) {
          document.getElementById("news").innerHTML =
            "<span class='item'>Aguardando novas notícias do BBB...</span>";
          return;
        }

        const content = data.news
          .map(n => `<span class="item">🔥 ${n}</span>`)
          .join("");

        document.getElementById("news").innerHTML = content;
        document.getElementById("news-clone").innerHTML = content;
      } catch (e) {
        document.getElementById("news").innerHTML =
          "<span class='item'>Erro ao carregar notícias</span>";
      }
    }

    loadNews();
    setInterval(loadNews, 300000); // atualiza a cada 5 minutos
  </script>
</body>
</html>
